
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCOIN Network Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #080d18;
      color: #e8edf7;
      font-family: Arial, sans-serif;
    }
    main { max-width: 1000px; margin: auto; }
    header { margin-bottom: 28px; }
    h1 { margin-bottom: 6px; color: #fff; }
    .muted { color: #8b9bb5; }
    .panel {
      background: #111a2b;
      border: 1px solid #25334a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .value { font-size: 22px; font-weight: bold; margin-top: 10px; }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #354764;
      margin-top: 10px;
      background: #0b1322;
      color: white;
      font-size: 15px;
    }
    button { background: #2463eb; border: 0; font-weight: bold; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .status { color: #f5bd55; }
    @media(max-width: 500px) { body { padding: 14px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>DCOIN Explorer</h1>
    <div class="muted">Independent blockchain network</div>
    <p class="status" id="status">API not connected</p>
  </header>

  <section class="panel">
    <strong>Node API URL</strong>
    <input id="apiUrl" type="url" placeholder="https://your-dcoin-node.example">
    <button onclick="connectAPI()">Connect to DCOIN Node</button>
  </section>

  <section class="grid">
    <div class="panel">
      <div class="muted">Network</div>
      <div class="value" id="network">—</div>
    </div>
    <div class="panel">
      <div class="muted">Symbol</div>
      <div class="value" id="symbol">—</div>
    </div>
    <div class="panel">
      <div class="muted">Block Height</div>
      <div class="value" id="height">—</div>
    </div>
    <div class="panel">
      <div class="muted">Total Supply</div>
      <div class="value" id="supply">—</div>
    </div>
  </section>

  <section class="panel">
    <h3>Latest Block</h3>
    <pre id="block">Waiting for API connection...</pre>
  </section>

  <section class="panel">
    <h3>TDCO Test Token</h3>
    <pre id="token">Waiting for API connection...</pre>
  </section>

  <section class="panel">
    <h3>Recent Transactions</h3>
    <pre id="transactions">Waiting for API connection...</pre>
  </section>
</main>

<script>
async function connectAPI() {
  const base = document.getElementById("apiUrl").value.trim().replace(/\/+$/, "");
  const status = document.getElementById("status");

  if (!base) {
    status.textContent = "Enter your node API URL first.";
    return;
  }

  status.textContent = "Connecting...";

  try {
    const [network, block, token, transactions] = await Promise.all([
      fetch(base + "/api/v1/network").then(checkResponse),
      fetch(base + "/api/v1/blocks/latest").then(checkResponse),
      fetch(base + "/api/v1/token").then(checkResponse),
      fetch(base + "/api/v1/transactions").then(checkResponse)
    ]);

    document.getElementById("network").textContent = network.name;
    document.getElementById("symbol").textContent = network.symbol;
    document.getElementById("height").textContent = network.block_height;
    document.getElementById("supply").textContent =
      (network.total_supply / Math.pow(10, network.decimals)).toLocaleString() + " DCO";

    document.getElementById("block").textContent =
      JSON.stringify(block, null, 2);

    document.getElementById("token").textContent =
      JSON.stringify(token, null, 2);

    document.getElementById("transactions").textContent =
      JSON.stringify(transactions, null, 2);

    status.textContent = "Connected to DCOIN API";
  } catch (error) {
    status.textContent = "Connection failed: " + error.message;
  }
}

async function checkResponse(response) {
  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}
</script>
</body>
  </html>
